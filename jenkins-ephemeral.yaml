apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: gitops-deploy
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.jenkins: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"jenkins"}}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-admin
  namespace: gitops-deploy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: gitops-deploy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: gitops-deploy
  labels:
    app: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins
      containers:
      - name: jenkins
        image: image-registry.openshift-image-registry.svc:5000/openshift/jenkins:2
        env:
        - name: OPENSHIFT_ENABLE_OAUTH
          value: "true"
        ports:
        - containerPort: 8080
          name: web
        - containerPort: 50000
          name: agent
        volumeMounts:
        - name: jenkins-data
          mountPath: /var/lib/jenkins
        resources:
          limits:
            memory: 2Gi
          requests:
            memory: 1Gi
      volumes:
      - name: jenkins-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: gitops-deploy
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: jenkins-tls
spec:
  ports:
  - name: web
    port: 8080
    targetPort: 8080
  - name: agent
    port: 50000
    targetPort: 50000
  selector:
    app: jenkins
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jenkins
  namespace: gitops-deploy
spec:
  to:
    kind: Service
    name: jenkins
  port:
    targetPort: web
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
